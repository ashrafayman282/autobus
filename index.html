<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملاهي 15 مايو 🎡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ff;--panel:#fff;--panel2:#eee9ff;--line:#d8d1ff;--ink:#241f45;--mute:#6d6893;--pri:#ff4f81;--pri2:#ff8a3d;--bus:#ffc933;--busink:#2b2100;--teal:#10b79f;--bad:#e5484d;--good:#0f9f76;--sh:rgba(36,31,69,.2)}
[data-theme=dark]{--bg:#120f26;--panel:#1d1941;--panel2:#292359;--line:#3a3377;--ink:#f5f2ff;--mute:#a8a2d8;--pri:#ff6b97;--pri2:#ff9a5c;--teal:#2ad6bd;--bad:#ff6a70;--good:#2fbf8f;--sh:rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.6;min-height:100vh;background:radial-gradient(circle at 10% 6%,rgba(255,79,129,.16),transparent 38%),radial-gradient(circle at 92% 18%,rgba(16,183,159,.16),transparent 38%),var(--bg);background-attachment:fixed;transition:background-color .3s,color .3s}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 14px 30px}
h1,h2,h3{font-family:Lalezar,Cairo,sans-serif;font-weight:400;margin:0}
h2{font-size:1.7rem;margin:16px 0 6px}h3{font-size:1.2rem}
.small{font-size:.9rem;color:var(--mute)}
.deco span{position:fixed;font-size:2rem;opacity:.22;pointer-events:none;z-index:0;animation:fl 16s ease-in-out infinite}
.top{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;background:var(--bg);border-bottom:2px solid var(--line);margin-bottom:8px}
.tools{display:flex;gap:8px;align-items:center}
.logo{font-family:Lalezar;font-size:1.35rem;background:linear-gradient(90deg,var(--pri),var(--pri2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
button.logo{border:0;box-shadow:none;background-color:transparent;padding:4px 8px}
.hero{text-align:center;padding:26px 0 6px}
.hero .wheel{font-size:4rem;display:inline-block;animation:spin 14s linear infinite}
.hero h1{font-size:3.2rem;line-height:1.2;background:linear-gradient(90deg,var(--pri),var(--pri2),var(--bus),var(--teal));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.hero p{margin:4px 0 0;color:var(--mute);font-weight:700}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;animation:pop .35s both;box-shadow:0 4px 0 var(--sh)}
input{font:inherit;font-size:1.05rem;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:100%;transition:border-color .15s,transform .15s}
input:focus{border-color:var(--pri);transform:scale(1.01)}
input:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input:disabled{opacity:.6}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--sh);transition:transform .12s,box-shadow .12s,filter .12s}
button:hover{transform:translateY(-2px);filter:brightness(1.06)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
button.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:none}
button.on{background:var(--bad);color:#fff}
button.sm{padding:5px 11px;font-size:.9rem}
button.big{width:100%;font-family:Lalezar,Cairo;font-weight:400;font-size:1.5rem;padding:13px;margin-top:12px}
button.big.ghost{box-shadow:none}
button:disabled{opacity:.5;cursor:default}
label{display:block;font-weight:800;margin:14px 0 5px}
.seg{display:flex;gap:8px}.seg button{flex:1}
.seg button:not(.sel){background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel2);color:var(--mute);border:2px solid var(--line);padding:6px 12px;font-weight:700;box-shadow:none}
.chip.on{background:var(--bus);color:var(--busink);border-color:var(--bus)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:20px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:right;padding:22px;border-radius:24px;min-height:200px;color:#fff;box-shadow:0 8px 0 var(--sh);animation:pop .45s both}
.tile:hover{transform:translateY(-6px) rotate(-1deg)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.t1{background:linear-gradient(135deg,#ff4f81,#ff8a3d)}.t2{background:linear-gradient(135deg,#6c4cff,#10b79f);animation-delay:.1s}
.tile .ti{font-size:3.6rem;line-height:1.1;transition:transform .3s}.tile:hover .ti{transform:rotate(-14deg) scale(1.25)}
.tile b{font-family:Lalezar;font-size:1.55rem;font-weight:400}.tile small{opacity:.95;font-weight:700}
.tile em{margin-top:auto;font-style:normal;background:rgba(255,255,255,.25);padding:2px 12px;border-radius:20px;font-size:.85rem}
.letter{font-family:Lalezar;font-size:5rem;line-height:1;color:var(--busink);background:linear-gradient(135deg,var(--bus),var(--pri2));border-radius:24px;width:116px;height:116px;display:grid;place-items:center;margin:8px auto;box-shadow:0 6px 0 var(--sh);animation:spin2 .7s both}
#ban{text-align:center;font-weight:900;font-size:1.2rem;min-height:2em;color:var(--pri)}
.cd{display:block;font-family:Lalezar;font-size:5rem;line-height:1;animation:beat .9s both}
.bar{height:10px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--bus),var(--pri));transition:width .3s linear}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .n{font-weight:800;min-width:6.5em;display:flex;align-items:center}
.row .a{flex:1;word-break:break-word;min-width:6em;font-weight:700}
.row .a.bad{color:var(--mute);text-decoration:line-through;font-weight:400}
.pp{display:flex;gap:4px}
.pp button{padding:4px 11px;font-size:.9rem;box-shadow:none;background:var(--panel2);color:var(--ink)}
.pp button.sel{background:var(--pri);color:#fff}.pp button.auto{outline:2px dashed var(--teal)}
.pts{font-weight:900;color:var(--good)}.pts.z{color:var(--mute);font-weight:400;font-size:.9rem}
.lb{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.lb:first-of-type{border-top:0}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;color:#fff;font-style:normal;font-weight:900;margin-inline-end:8px;flex:none}
.rk{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--panel2);font-style:normal;font-size:.85rem;margin-inline-end:8px}
.pgrid{display:flex;flex-wrap:wrap;gap:10px}
.pc{display:flex;align-items:center;background:var(--panel2);border-radius:30px;padding:4px 14px 4px 6px;font-weight:800;animation:pop .35s both}
.rm{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--mute)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px 10px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-weight:800;padding:10px 18px;border-radius:14px;display:none;z-index:50;box-shadow:0 4px 0 var(--sh)}
.credit{position:relative;z-index:1;text-align:center;padding:26px 14px 34px;margin-top:20px;border-top:2px dashed var(--line)}
.credit .c1{display:block;color:var(--mute);font-weight:700}
.credit .c2{display:block;font-family:Lalezar;font-size:2rem;line-height:1.4;background:linear-gradient(90deg,var(--pri),var(--bus),var(--teal),var(--pri));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.credit .c3{display:block;color:var(--mute);font-size:.85rem}
.fab{position:fixed;left:16px;bottom:16px;z-index:19;width:58px;height:58px;border-radius:50%;font-size:1.6rem;padding:0;background:var(--teal)}
.fab b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-size:.8rem;display:grid;place-items:center;animation:beat .9s infinite}
.cp{position:fixed;left:0;bottom:0;z-index:20;width:min(100%,390px);height:min(72vh,540px);background:var(--panel);border:2px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 24px var(--sh);animation:up .25s both}
.cph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:2px solid var(--line)}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:85%;padding:6px 12px;border-radius:14px;background:var(--panel2);align-self:flex-start;word-break:break-word}
.m.me{background:var(--pri);color:#fff;align-self:flex-end}.m small{display:block;opacity:.75;font-size:.75rem}
.emo{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;border-top:1px solid var(--line)}
.emo button{padding:3px 8px;font-size:1.3rem;box-shadow:none;background:transparent;border:0}
.cin{display:flex;gap:8px;padding:8px}
#dlg .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40;padding:16px}
#dlg .card{width:min(100%,380px)}
.cf{position:fixed;top:-30px;z-index:60;pointer-events:none;animation:fall 3s ease-in forwards}
.wheel2{position:fixed;right:-80px;bottom:-80px;width:260px;height:260px;color:var(--pri);opacity:.12;z-index:0;pointer-events:none;animation:spin 120s linear infinite}
.scene{position:fixed;left:0;right:0;bottom:0;height:130px;pointer-events:none;z-index:0;overflow:hidden;color:var(--teal)}
.scene .cl{position:absolute;left:0;font-size:3rem;opacity:.14;animation:drift 90s linear infinite}
.coaster{position:absolute;left:0;bottom:0;width:1200px;height:110px;opacity:.22}
.coaster svg{position:absolute;inset:0}
.cart{position:absolute;left:0;top:0;font-size:1.5rem;offset-path:path('M0 90Q120 -10 240 70T480 70T720 40T960 80T1200 30');offset-rotate:0deg;animation:ride 30s linear infinite}
@keyframes drift{from{transform:translateX(-10vw)}to{transform:translateX(110vw)}}
@keyframes ride{from{offset-distance:0%}to{offset-distance:100%}}
button.yel{background:var(--bus);color:var(--busink)}
.tile .ti.sm{font-size:2.2rem;letter-spacing:2px}
.t3{background:linear-gradient(135deg,#e63946,#ffb703);animation-delay:.2s}.t4{background:linear-gradient(135deg,#0f766e,#2f6fed);animation-delay:.3s}
.t5{background:linear-gradient(135deg,#10b79f,#2fb344)}.t6{background:linear-gradient(135deg,#6c4cff,#2f6fed)}.t7{background:linear-gradient(135deg,#ff8a3d,#e63946)}.t8{background:linear-gradient(135deg,#ffb703,#0f9f76)}
details.rules summary{cursor:pointer;font-weight:800}details.rules ul{margin:8px 0 0;padding-inline-start:20px}details.rules li{margin:4px 0}
.crd{position:relative;width:62px;height:90px;border-radius:10px;background:#fff;color:#222;box-shadow:0 3px 8px var(--sh);display:inline-grid;place-items:center;font-weight:900;flex:none;user-select:none;border:2px solid #fff;transition:transform .18s,box-shadow .18s,opacity .18s}
.crd.rd{color:#d62839}
.crd .q1,.crd .q2{position:absolute;font-size:.72rem;line-height:1.05;text-align:center;font-weight:900}
.crd .q1{top:4px;left:5px}.crd .q2{bottom:4px;right:5px;transform:rotate(180deg)}
.crd .cm{font-size:1.9rem;line-height:1}
.crd.back{background:repeating-linear-gradient(45deg,#3a2fa0 0 6px,#5b4cff 6px 12px)}
.crd.u{color:#fff}.crd.u.k0{background:#e63946}.crd.u.k1{background:#ffb703;color:#2b2100}.crd.u.k2{background:#2fb344}.crd.u.k3{background:#2f6fed}
.crd.u.kw{background:conic-gradient(#e63946 0 25%,#ffb703 0 50%,#2fb344 0 75%,#2f6fed 0);text-shadow:0 1px 3px #000}
.crd.u .cm{font-size:1.45rem;background:rgba(255,255,255,.22);width:72%;height:52%;border-radius:50%;display:grid;place-items:center;transform:rotate(-20deg)}
.hand{display:flex;justify-content:center;padding:18px 10px 8px;overflow-x:auto;min-height:130px}
.hand .crd{margin-inline-start:-14px}.hand .crd:first-child{margin-inline-start:0}
.hand.my .crd.ok{cursor:pointer;box-shadow:0 0 0 3px var(--teal),0 3px 8px var(--sh)}
.hand.my .crd.ok:hover{transform:translateY(-18px) scale(1.06);z-index:3}
.hand.my .crd.no{opacity:.5}
.deal{animation:dealIn .5s cubic-bezier(.2,.8,.3,1) both}
.flyme{animation:flyMe .45s cubic-bezier(.2,.8,.3,1) both}.flyop{animation:flyOp .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes dealIn{from{transform:translateY(-240px) rotate(-35deg) scale(.4);opacity:0}}
@keyframes flyMe{from{transform:translateY(220px) rotate(-30deg) scale(1.25)}}
@keyframes flyOp{from{transform:translateY(-230px) rotate(30deg) scale(1.2)}}
.tbl{display:flex;justify-content:center;align-items:center;gap:28px;margin:16px 0;flex-wrap:wrap}
.pile{position:relative;width:62px;height:90px}.pile .crd{position:absolute;inset:0}
.pile .crd:nth-child(2){transform:translate(3px,-3px)}.pile .crd:nth-child(3){transform:translate(6px,-6px)}
.pile.ok{cursor:pointer;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.ring{padding:10px;border-radius:18px;box-shadow:0 0 0 5px var(--rc,transparent),0 0 26px var(--rc,transparent);transition:box-shadow .3s}
.opps{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.op{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 12px;min-width:92px}
.op.turn{border-color:var(--pri);animation:glow 1.4s ease-in-out infinite}.op.tg{border-color:var(--teal)}
.op .fan{display:flex;flex-wrap:wrap;justify-content:center;max-width:260px}
.op .fan .crd{width:24px;height:34px;border-radius:5px;margin-inline-start:-10px;border-width:1px}
.op .fan .crd.pk{width:36px;height:52px;border-radius:7px;margin:2px;cursor:pointer}.op .fan .crd.pk:hover{transform:translateY(-8px)}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(255,79,129,.3)}}
.ubn{position:fixed;top:32%;left:50%;font-family:Lalezar;font-size:3.6rem;color:#fff;background:var(--pri);padding:4px 28px;border-radius:24px;z-index:30;pointer-events:none;text-align:center;line-height:1.2;animation:ubn 1.5s both}
.ubn.sm{font-size:2rem;background:var(--teal)}.ubn small{display:block;font-size:1rem;font-family:Cairo}
@keyframes ubn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}22%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:25;padding:16px}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:10px}.picker button{height:70px;font-size:1.2rem}
.dir{font-size:2rem;display:inline-block;animation:spin 6s linear infinite}
.turncard{border-color:var(--pri)}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin2{from{transform:scale(.3) rotate(-200deg);opacity:0}}
@keyframes shine{to{background-position:200% 0}}
@keyframes beat{from{transform:scale(1.7);opacity:.2}}
@keyframes fl{50%{transform:translateY(-14px) rotate(5deg)}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf,.deco,.scene,.wheel2{display:none}}
/* ===== تحسينات الشكل والحركة ===== */
main{max-width:min(980px,100%)}
.top{flex-wrap:wrap}
.tools{flex-wrap:wrap;justify-content:flex-end}
.hero h1{font-size:clamp(2.2rem,9vw,3.4rem)}
.hero .wheel{filter:drop-shadow(0 6px 10px rgba(255,79,129,.35))}
.tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.tile{position:relative;overflow:hidden;min-height:230px}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
.tile:hover::after{transform:translateX(120%)}
.tile .art{display:block;width:100%;height:96px;margin-bottom:2px}
.tile .art svg{width:100%;height:100%;overflow:visible;animation:artbob 3.6s ease-in-out infinite;filter:drop-shadow(0 5px 0 rgba(0,0,0,.18))}
.tile:hover .art svg{animation-duration:1.2s}
@keyframes artbob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.t9{background:linear-gradient(135deg,#7c3aed,#ec4899)}.t10{background:linear-gradient(135deg,#0ea5e9,#22c55e)}
.tile em{align-self:flex-start}
.card{transition:transform .2s,box-shadow .2s}
h2{animation:fadeUp .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
/* أزرار الصوت */
.tools .ghost.sm{padding:4px 9px}
/* الأفاتار */
.av.em{background:var(--panel2)!important;font-size:1.25rem;line-height:1;box-shadow:inset 0 0 0 2px var(--line)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:6px}
.avb{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border-radius:14px;background:var(--panel2);color:var(--ink);border:2px solid var(--line);box-shadow:none;line-height:1.15}
.avb span{font-size:2rem}.avb small{font-size:.7rem;font-weight:700;color:var(--mute)}
.avb.sel{border-color:var(--pri);background:var(--panel);transform:scale(1.06);box-shadow:0 0 0 3px rgba(255,79,129,.25)}
.avb:hover{transform:translateY(-3px) rotate(-2deg)}
.avb.sel:hover{transform:scale(1.06)}
/* الشات هادي */
.fab{left:12px;bottom:12px;width:44px;height:44px;font-size:1.15rem;opacity:.85;box-shadow:0 3px 0 var(--sh)}
.fab:hover{opacity:1}
.fab b{animation:none!important;min-width:18px;height:18px;border-radius:9px;font-size:.7rem;top:-4px;right:-4px;padding:0 3px}
/* الأسئلة */
.scs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.scp{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:30px;padding:3px 12px 3px 4px;font-weight:800;transition:transform .2s,border-color .2s}
.scp.hot{border-color:var(--pri);transform:scale(1.07);animation:glow 1.4s ease-in-out infinite}
.scp b{font-family:Lalezar;font-size:1.3rem;min-width:1.2em;text-align:center}
.qcard{text-align:center;animation:flipIn .5s both}
@keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateX(-40deg) translateY(16px)}}
.qt{font-size:clamp(1.25rem,5vw,1.8rem);line-height:1.5;margin:8px 0 2px}
.qimg{margin:8px auto;width:min(100%,320px);height:200px;border-radius:16px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;border:2px solid var(--line)}
.qimg img{width:100%;height:100%;object-fit:contain;background:#fff}
.qimg:not(.ok):not(.none)::before{content:"⏳";font-size:2rem;animation:spin 2s linear infinite}
.qimg.none::before{content:"🖼️ الصورة مش متاحة";font-weight:800;color:var(--mute);font-size:.95rem}
.qmsg{text-align:center;font-weight:900;font-size:1.15rem;margin:10px 0;padding:8px 12px;border-radius:14px;background:var(--panel2);animation:pop .3s both}
.qmsg.ok{background:rgba(15,159,118,.18);color:var(--good)}.qmsg.bad{background:rgba(229,72,77,.15);color:var(--bad);animation:shake .45s both}

/* ===== دومينو ===== */
const DK=['dm','dma'],isD=k=>DK.includes(k);
const dAll=()=>{const r=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)r.push(a+'-'+b);return r};
const dp=t=>String(t).split('-').map(Number);
const dSum=t=>{const[a,b]=dp(t);return a+b};
const dDbl=t=>{const[a,b]=dp(t);return a===b};
const dEnds=st=>{const bd=A(st.bd);if(!bd.length)return null;return [dp(bd[0])[0],dp(bd[bd.length-1])[1]]};
function dSides(st,t){
  const e=dEnds(st);
  if(!e)return (!st.first||t===st.first)?['R']:[];
  const[a,b]=dp(t),r=[];
  if(a===e[0]||b===e[0])r.push('L');
  if(a===e[1]||b===e[1])r.push('R');
  return r;
}
const dPlayable=(st,p)=>A(st.hands[p]).filter(t=>dSides(st,t).length);
function dEndVal(st){
  const bd=A(st.bd);if(!bd.length)return 0;
  if(bd.length===1)return dSum(bd[0]);
  const l=dp(bd[0])[0],r=dp(bd[bd.length-1])[1];
  return (dDbl(bd[0])?l*2:l)+(dDbl(bd[bd.length-1])?r*2:r);
}
function dDeal(st){
  const n=st.order.length,all=shuf(dAll());
  st.hands={};st.order.forEach((p,i)=>st.hands[p]=all.slice(i*7,i*7+7));
  st.yd=all.slice(n*7);st.bd=[];st.pass=0;st.last=null;st.ev=null;
  let best=null,bi=0,bd=-1;
  st.order.forEach((p,i)=>A(st.hands[p]).forEach(t=>{const d=dDbl(t)?100+dSum(t):dSum(t);if(d>bd){bd=d;best=t;bi=i}}));
  st.first=best;st.turn=bi;st.ph='play';
}
function dRound(st,w,reason){
  const others=st.order.filter(p=>p!==w);
  let pts=0;
  if(st.kind==='dma'){
    const hs={};st.order.forEach(p=>hs[p]=A(st.hands[p]).reduce((s,t)=>s+dSum(t),0));
    pts=reason==='out'?others.reduce((s,p)=>s+hs[p],0):others.reduce((s,p)=>s+hs[p],0)-hs[w];
    pts=Math.max(0,Math.round(pts/5)*5);
    st.sc[w]=(st.sc[w]||0)+pts;
  }
  st.rs={w,reason,pts};st.v++;
  if(st.kind==='dm'||st.sc[w]>=st.target){
    const top=Math.max(...st.order.map(p=>st.sc[p]||0));
    st.over=1;st.winner=st.kind==='dm'?w:(st.order.find(p=>(st.sc[p]||0)===top));st.pts={};st.pts[st.winner]=1;
  }else st.ph='rd';
  return st;
}
function dSettle(st){
  const n=st.order.length;
  for(let g=0;g<n+1;g++){
    const cur=st.order[st.turn];
    if(dPlayable(st,cur).length||A(st.yd).length)return st;
    st.pass=(st.pass||0)+1;st.ev={t:'skip',p:cur};

function quizEng(kind){
  return {
    init(ids,o,ts){
      o=o||{};

      let pool=QB.map((q,i)=>i).filter(i=>VOK.has(i)&&cats.includes(QB[i].c)&&(kind==='qz'||!QB[i].open));
      let seen=[];try{seen=JSON.parse(localStorage.seenq||'[]')}catch(e){}
      const fresh=pool.filter(i=>!seen.includes(i));
      const use=fresh.length>=need?fresh:pool;
      const qs=mixCats(use).slice(0,need);
      try{localStorage.seenq=JSON.stringify([...seen.filter(i=>!qs.includes(i)),...qs].slice(-600))}catch(e){}
      const st={kind,v:0,order:ids,sc:{},qs,qi:0,on:!!o.on,lead:Math.max(2,Math.min(20,+o.lead||5))};
      ids.forEach(p=>st.sc[p]=0);

    },
    act(o,p,a){
      const st=clone(o);
      if(st.over)return null;
      st.sc=st.sc||{};st.tried=st.tried||{};st.an=st.an||{};
      const q=QB[st.qs[st.qi]],ts=+a.ts||0,inG=st.order.includes(p);
      const rev=(ms,rv)=>{st.ph='rev';st.until=ts+ms;st.tot=ms;st.rv=rv;st.v++;return st};
      const next=()=>{
        const r=qRank(st);
        if(kind==='qm'&&r.length>=2&&((st.sc[r[0]]||0)-(st.sc[r[1]]||0))>=st.lead){qFinish(st);st.v++;return st}
        st.qi++;
        if(st.qi>=st.qs.length){qFinish(st);st.v++;return st}
        qSet(st,ts);st.v++;return st;
      };
      if(a.t==='adv'){if(st.ph!=='rev'||!a.adm)return null;return next()}
      if(kind==='qz'){

          const b=st.by;if(!b)return null;

          st.sc[b]=(st.sc[b]||0)-1;st.tried[b]=1;st.lw={p:b,txt:st.typed||''};st.by=null;st.typed='';

          st.typed=String(a.txt||'').slice(0,60);
          if(q.open){st.ph='judge';st.auto=0;st.until=0;st.tot=0;st.v++;return st}
          if(qMatch(q,st.typed))return judge(true);
          st.ph='judge';st.auto=1;st.until=ts+5000;st.tot=5000;st.v++;return st;
        }
        if(a.t==='judge'){if(!a.adm||!(st.ph==='judge'||(st.ph==='ans'&&!st.on)))return null;return judge(!!a.ok)}
        if(a.t==='timeout'){if(st.ph!=='ans'||ts<st.until-500)return null;return judge(false)}
        if(a.t==='skip'){if(!a.adm||!['ask','ans','judge'].includes(st.ph))return null;return rev(3500,{skip:1})}
        return null;
      }
      if(a.t==='pick'){if(st.ph!=='q'||!inG||st.an[p]!=null||!(a.i>=0&&a.i<4))return null;st.an[p]=a.i;st.v++;return st}
      if(a.t==='resolve'){
        if(st.ph!=='q')return null;
        const all=st.order.every(x=>st.an[x]!=null);
        if(!all&&ts<st.until-300)return null;
        const ok=[];st.order.forEach(x=>{if(st.an[x]===st.ci){st.sc[x]=(st.sc[x]||0)+1;ok.push(x)}});
        return rev(4500,{ok});
      }
      return null;
    }
  };
}

function mixCats(ids){const by={};shuf(ids).forEach(i=>{(by[QB[i].c]=by[QB[i].c]||[]).push(i)});const out=[];let last=null;while(Object.values(by).some(a=>a.length)){const ks=Object.keys(by).filter(k=>by[k].length);let c=ks.filter(k=>k!==last);if(!c.length)c=ks;const w=c.flatMap(k=>Array(by[k].length).fill(k));const k=w[rnd(w.length)];out.push(by[k].pop());last=k}return out}

function dropP(o,p){
  const st=clone(o),i=st.order.indexOf(p);
  if(i<0||st.over)return null;
  if(isD(st.kind)){const hd=A(st.hands[p]);st.yd=[...A(st.yd),...hd];delete st.hands[p];st.order.splice(i,1);if(st.sc)delete st.sc[p];if(st.order.length<2){st.over=1;st.aborted=1;st.winner=null;st.pts={}}else{if(i<st.turn)st.turn--;st.turn%=st.order.length;if(st.ph==='play'){dSettle(st)}}st.v++;return st}
  if(isQ(st.kind)){st.order.splice(i,1);if(st.sc)delete st.sc[p];if(st.order.length<2){qFinish(st);st.aborted=1}else if(st.by===p){st.by=null;st.ph='ask'}st.v++;return st}
  const cur=st.order[st.turn],h=A(st.hands[p]);
  st.order.splice(i,1);delete st.hands[p];
  if(st.stat)delete st.stat[p];
  if(st.kind==='c_war')st.pot=[...A(st.pot),...h];else if(st.kind!=='c_21')st.deck=[...h,...A(st.deck)];
  const min=st.kind==='c_21'?1:2;
  if(st.order.length<min){st.over=1;st.aborted=1;st.winner=st.order[0]||null;st.pts=st.order[0]?{[st.order[0]]:1}:{};st.v++;return st}
  const ci=st.order.indexOf(cur);st.turn=ci>=0?ci:i%st.order.length;st.drew=-1;
  if(st.kind==='c_21'&&cur===p){BJ.adv(st,i-1)}
  if(st.kind==='c_old'){
    const act=oldActive(st);
    if(act.length<=1){st.over=1;st.loser=act[0]||null;st.pts={};st.order.forEach(x=>{if(x!==st.loser)st.pts[x]=1})}
    else if(!A(st.hands[st.order[st.turn]]).length){const n=st.order.length;for(let k=1;k<=n;k++){const r=st.order[(st.turn+k)%n];if(A(st.hands[r]).length){st.turn=st.order.indexOf(r);break}}}
  }
  st.v++;return st;
}

async function cgAct(a){
  let fin=null;
  const tx=await runTransaction(ref(db,base()+'/cg'),old=>{
    if(!old)return undefined;
    const nv=a.t==='drop'?dropP(old,a.p):ENG[old.kind].act(old,pid,{...a,adm:isAdmin()});
    if(!nv)return undefined;
    fin=nv.over&&!old.over?nv:null;
    return nv;
  });

}

function startRound(){
  if(!isAdmin())return;
  const g=S.game||{},r=g.phase==='results'?g.round+1:1;
  let used=r===1?[]:[...S.used],pool=LETTERS.filter(l=>!used.includes(l));
  if(!pool.length){used=[];pool=[...LETTERS]}
  const letter=pool[rnd(pool.length)];
  const cats=S.meta.kind==='classic'?[...S.meta.cats]:shuf(S.meta.cats).slice(0,5);
  const up={game:{phase:'play',round:r,letter,cats,endAt:S.meta.limit?now()+S.meta.limit*1000:0},used:[...used,letter]};
  if(r===1){up.r=null;up.hist=null;Object.keys(S.players).forEach(id=>up['players/'+id+'/score']=0)}
  update(ref(db,base()),up);
  set(ref(db,`idx/${S.rid}/st`),'play');
}

function calc(R,letter,n){
  n=n||5;
  const A=R.answers||{},V=R.votes||{},O=R.ov||{},ids=Object.keys(A),L=key(letter),out={};
  ids.forEach(id=>out[id]={n:A[id].n,t:0,c:Array(n).fill(0),x:Array(n).fill(0),f:Array(n).fill(0)});
  for(let i=0;i<n;i++){
    const ok={},cnt={};
    ids.forEach(id=>{
      const w=key(A[id].a?.[i]),dis=ids.filter(v=>v!==id&&V[v]?.[`${id}_${i}`]).length;
      out[id].f[i]=dis;
      if(!w)out[id].x[i]=1;
      else if(w[0]!==L)out[id].x[i]=2;
      else if(dis>(ids.length-1)/2)out[id].x[i]=3;
      else{ok[id]=w;cnt[w]=(cnt[w]||0)+1}
    });
    Object.entries(ok).forEach(([id,w])=>out[id].c[i]=cnt[w]===1?10:5);
    ids.forEach(id=>{const o=O[`${id}_${i}`];if(o&&o.p!=null&&key(A[id].a?.[i]))out[id].c[i]=+o.p});
  }
  ids.forEach(id=>out[id].t=out[id].c.reduce((a,b)=>a+b,0));
  return out;
}
async function approve(){
  if(!isAdmin())return;
  const round=S.game.round;
  const tx=await runTransaction(ref(db,base()+'/game'),g=>g&&g.phase==='review'&&g.round===round?{...g,phase:'tally'}:undefined);
  if(!tx.committed)return;
  const [a,pl]=await Promise.all([get(ref(db,`${base()}/r/${round}`)),get(ref(db,base()+'/players'))]);
  const G=tx.snapshot.val(),P=pl.val()||{},scores=calc(a.val()||{},G.letter,G.cats.length),up={};
  Object.entries(scores).forEach(([id,s])=>{if(P[id])up[`players/${id}/score`]=increment(s.t);up[`hist/${round}/${id}`]=s.t});
  up['game/last']={round,scores};up['game/phase']='results';
  update(ref(db,base()),up);
}

  }).join('');
  S.seen=vis;
  return `<div id="ban">${st.over?'':myTurn?'دورك! اسحب ولا وقّف؟':`دور ${esc(nm(cur))}`}</div>${dealer}${rows}`+(myTurn?`<div class="rm" style="gap:10px"><button class="big" data-act="bhit">اسحب 🃏</button><button class="big ghost" data-act="bstand">وقّف ✋</button></div>`:'');
}
const pickerV=st=>{
  const uno=st.kind==='uno';
  return `<div class="ovl"><div class="card" style="width:min(100%,360px)"><h3 style="text-align:center">${uno?'اختار اللون 🎨':'اختار النوع'}</h3><div class="picker" style="margin-top:12px">${[0,1,2,3].map(i=>uno?`<button data-act="ucol" data-c="${i}" style="background:${UC[i]};color:${i===1?'#2b2100':'#fff'}">${UCN[i]}</button>`:`<button class="ghost" data-act="ucol" data-c="${i}" style="font-size:2rem;color:${i===1||i===2?'#d62839':'inherit'}">${SU[i]}</button>`).join('')}</div><button class="big ghost" data-act="ucancel">إلغاء</button></div></div>`;
};
function overV(st){
  const adm=isAdmin(),k=st.kind;let body='';
  if(isQ(k))body=quizOver(st);else if(k==='c_old')body=st.loser?`<div style="font-size:3rem">😂</div><h2>${esc(nm(st.loser))} معاه الشايب!</h2><p class="small">باقي اللاعبين خدوا نقطة</p>`:`<h2>انتهت الجولة</h2>`;
  else if(k==='c_21')body=`<h2>نتيجة الجولة</h2>`+st.order.map(p=>`<div class="lb"><span style="display:flex;align-items:center">${av(nm(p))}${esc(nm(p))}</span><b>${{win:'🏆 كسب',lose:'❌ خسر',push:'🤝 تعادل'}[st.res&&st.res[p]]||''}</b></div>`).join('');
  else body=`<div style="font-size:3rem">🏆</div><h2>${st.winner?esc(nm(st.winner))+(k==='c_war'?' كسب الحرب!':' كسب الجولة!'):'اتلغت الجولة'}</h2>`+(st.winner&&st.pts&&st.pts[st.winner]?`<p class="pts">+${st.pts[st.winner]} نقطة</p>`:'');
  return `<div class="ovl"><div class="card" style="text-align:center;width:min(100%,400px)">${body}${adm?`<button class="big" data-act="cnew">جولة جديدة 🔁</button><button class="big ghost" data-act="clobby">رجوع لغرفة الانتظار</button>`:`<p class="small">مستنيين الأدمن...</p>`}<button class="big ghost" data-act="leave">خروج</button></div></div>`;
}

/* ===== تايمر ===== */
function tick(){
  sweep();quizTick();
  if(!S.rid||!S.meta)return;
  const g=S.game,ban=$('#ban');
  if(Object.keys(S.players).length&&S.players[pid]){
    if(S.players[S.meta.adminId])S.gone=0;
    else{
      S.gone=S.gone||Date.now();
      if(Date.now()-S.gone>15000){
        const f=Object.entries(S.players).sort((a,b)=>(a[1].t-b[1].t)||(a[0]<b[0]?-1:1))[0];
        if(f[0]===pid){update(ref(db),{[`rooms/${S.rid}/meta/adminId`]:pid,[`rooms/${S.rid}/meta/adminName`]:S.me,[`idx/${S.rid}/admin`]:S.me});S.gone=0}
      }
    }
  }
  if(S.cg&&S.cg.order&&!S.cg.over&&isAdmin()&&S.players[pid]){
    S.cg.order.forEach(p=>{
      if(S.players[p]){delete S.miss[p];return}
      S.miss[p]=S.miss[p]||Date.now();
      if(Date.now()-S.miss[p]>8000){delete S.miss[p];cgAct({t:'drop',p})}
    });
  }
  if(!g)return;
  if(g.phase==='countdown'){
    const rem=g.endAt-now(),n=Math.max(0,Math.ceil(rem/1000));
    if(ban&&ban.dataset.n!==String(n)){ban.dataset.n=n;ban.innerHTML=rem>0?`<small>${esc(g.by)} داس أتوبيس كومبليت!</small><span class="cd">${n}</span>`:'الوقت خلص ⏹'}
    if(rem<=0)endPlay(g,'countdown',rem);
  }else if(g.phase==='play'){
    if(g.endAt){
      const rem=g.endAt-now(),m=Math.max(0,Math.ceil(rem/1000)),b=$('#bar');
      if(b)b.style.width=Math.max(0,Math.min(100,rem/(S.meta.limit*10)))+'%';
      if(ban)ban.textContent=rem>0?`⏱ ${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`:'الوقت خلص';
      if(rem<=0)endPlay(g,'play',rem);
    }else if(ban)ban.textContent='اكتب إجابات تبدأ بالحرف ده، وأول واحد يخلص يدوس الزرار';
  }
}
function endPlay(g,from,rem){
  document.querySelectorAll('.ans').forEach(i=>i.disabled=true);
  if(S.sent!==g.round){S.sent=g.round;pushAns()}
  if(rem<-1500-S.jit&&S.mv!==from+g.round){S.mv=from+g.round;toReview(from)}
}
setInterval(tick,250);

/* ===== أحداث ===== */
let t;
document.addEventListener('input',e=>{
  if(!e.target.classList?.contains('ans'))return;
  S.mine[+e.target.dataset.i]=e.target.value;
  clearTimeout(t);t=setTimeout(pushAns,300);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.target.click();return}
  const id=e.target.id;
  if(id==='nm')login(e.target.value);
  else if(id==='pw'){const r=S.pending?.rid||S.ask;if(r)joinRoom(r,e.target.value)}
  else if(id==='ci')sendChat();
  else if(id==='nn')saveName();
  else if(id==='qa')submitAns();
});
const seg=(b)=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))};
const setAll=v=>{document.querySelectorAll('.chip[data-i]').forEach(c=>c.classList.toggle('on',v));$('#cc').textContent=v?CATS.length:0};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,k=b.dataset.k;
  if(a==='login')login($('#nm').value);
  else if(a==='theme')setTheme(isDark()?'light':'dark');
  else if(a==='rn'){if(gameActive())return toast('مينفعش تغيّر اسمك واللعب شغال 🎮');dlg(true)}
  else if(a==='rncancel')dlg(false);
  else if(a==='rnsave')saveName();
  else if(a==='hub'){S.kind=null;S.sub=null;S.creating=false;S.pending=null;S.view='';render()}
  else if(a==='grp'){S.sub=k;S.kind=null;S.view='';render()}
  else if(a==='game'){S.kind=k;S.view='';render()}
  else if(a==='quick')quickJoin();
  else if(a==='ask'){S.ask=b.dataset.r;render()}
  else if(a==='enter')joinRoom(b.dataset.r||S.pending.rid,$('#pw')?.value);
  else if(a==='copy')navigator.clipboard.writeText(location.origin+location.pathname+'?r='+S.rid).then(()=>toast('اتنسخ لينك الغرفة 🔗',1));
  else if(a==='newroom'){S.creating=true;render()}
  else if(a==='cancel'){S.creating=false;S.pending=null;S.view='';render()}
  else if(a==='vis'){S.form.priv=b.dataset.v==='1';seg(b);$('#pwbox').hidden=!S.form.priv}
  else if(a==='tl'){S.form.timed=b.dataset.v==='1';seg(b);$('#tmbox').hidden=!S.form.timed}
  else if(a==='cat'){b.classList.toggle('on');$('#cc').textContent=document.querySelectorAll('.chip.on[data-i]').length}
  else if(a==='catall')setAll(true);
  else if(a==='catnone')setAll(false);
  else if(a==='mk')mk();
  else if(a==='start')startRound();
  else if(a==='done')done();
  else if(a==='flag')flag(k);
  else if(a==='pt')setOv(k,()=>({p:+b.dataset.v}));
  else if(a==='rs')setOv(k,()=>null);
  else if(a==='approve')approve();
  else if(a==='fin'){update(ref(db,base()+'/game'),{phase:'final'});set(ref(db,`idx/${S.rid}/st`),'wait')}
  else if(a==='again'){update(ref(db,base()),{game:{phase:'lobby'},used:null,hist:null,r:null});set(ref(db,`idx/${S.rid}/st`),'wait')}
  else if(a==='leave')leave();
  else if(a==='chat'){S.chatOpen=!S.chatOpen;chatShell()}
  else if(a==='emo'){const i=$('#ci');i.value+=b.dataset.e;i.focus()}
  else if(a==='send')sendChat();
  else if(a==='stk'){S.form.stack=b.dataset.v==='1';seg(b)}
  else if(a==='cstart'||a==='cnew')cgStart();
  else if(a==='clobby')cgLobby();
  else if(a==='uplay'){const id=+b.dataset.id;if(S.cg.kind==='uno'?unoC(id).c<0:ceR(id)===7){S.pickWild=id;render()}else cgAct({t:'play',id})}
  else if(a==='ucol'){const id=S.pickWild;S.pickWild=null;cgAct({t:'play',id,col:+b.dataset.c})}
  else if(a==='ucancel'){S.pickWild=null;render()}
  else if(a==='udraw')cgAct({t:'draw'});
  else if(a==='upass')cgAct({t:'pass'});
  else if(a==='uuno')cgAct({t:'uno'});
  else if(a==='opick')cgAct({t:'pick',i:+b.dataset.i});
  else if(a==='wflip')cgAct({t:'flip'});
  else if(a==='bhit')cgAct({t:'hit'});
  else if(a==='bstand')cgAct({t:'stand'});
  else if(a==='qbuzz')cgAct({t:'buzz',ts:now()});
  else if(a==='qsub')submitAns();
  else if(a==='qjok')cgAct({t:'judge',ok:true,ts:now()});
  else if(a==='qjno')cgAct({t:'judge',ok:false,ts:now()});
  else if(a==='qskip')cgAct({t:'skip',ts:now()});
  else if(a==='qpeek'){S.peek=S.cg.gid+'-'+S.cg.v;render()}
  else if(a==='gsel')switchGame(k)
  else if(a==='qonroom'){update(ref(db),{[`rooms/${S.rid}/meta/opts/on`]:!(S.meta.opts&&S.meta.opts.on)})}
  else if(a==='fx')sendFx()
  else if(a==='fxset')fxDlg(true)
  else if(a==='fxclose')fxDlg(false)
  else if(a==='fxsel'){localStorage.fxk=k;try{if(ACC.u&&ACC.p){ACC.p.fx=k;set(ref(db,'users/'+ACC.u.uid+'/fx'),k)}}catch(e){}FUN.play(k);fxDlg(true)}
  else if(a==='dsel'){const t=b.dataset.t,sd=dSides(S.cg,t);if(!sd.length)return toast('الحجر ده مينفعش هنا');if(sd.length===1){S.dsel=null;cgAct({t:'play',tile:t,side:sd[0],ts:now()})}else{S.dsel=t;render()}}
  else if(a==='dplay'){const t=S.dsel;S.dsel=null;if(t)cgAct({t:'play',tile:t,side:b.dataset.s,ts:now()})}
  else if(a==='ddraw')cgAct({t:'draw',ts:now()})
  else if(a==='dnh')cgAct({t:'nh',ts:now()})
  else if(a==='gl')accSignIn()
  else if(a==='acc')accDlg(true)
  else if(a==='accclose')accDlg(false)
  else if(a==='accout'){accDlg(false);signOut(AUTH)}
  else if(a==='qnext')cgAct({t:'adv',ts:now()});
  else if(a==='qpick')cgAct({t:'pick',i:+b.dataset.i,ts:now()});
  else if(a==='qon'){S.form.on=b.dataset.v==='1';seg(b)}
  else if(a==='qcat')b.classList.toggle('on');
  else if(a==='mus'){const on=SND.toggleMus();document.querySelectorAll('[data-act="mus"]').forEach(x=>x.style.opacity=on?1:.45)}
  else if(a==='sfx'){const on=SND.toggleSfx();document.querySelectorAll('[data-act="sfx"]').forEach(x=>x.style.opacity=on?1:.45)}
  else if(a==='avsel'){localStorage.av=b.dataset.e;AVM[S.me]=b.dataset.e;document.querySelectorAll('.avb').forEach(x=>x.classList.toggle('sel',x===b));if(S.rid&&S.players[pid])update(ref(db),{[`rooms/${S.rid}/players/${pid}/av`]:b.dataset.e})}
});
S.target=new URLSearchParams(location.search).get('r');
render();
if(S.me&&sessionStorage.rid)enter(sessionStorage.rid);else if(S.me&&S.target)joinRoom(S.target);
</script>
</body>
</html>
